<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>生日禮物猜猜看 🎁</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff5c8a;--pink2:#ff8fb0;--ink:#27242a;--muted:#8e8991;--card:#fff;--bg:#fff7fa}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 50% -10%,#fff 0,#fff7fa 48%,#ffeef4 100%);color:var(--ink)}
body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px calc(28px + env(safe-area-inset-bottom));position:relative}
.top{text-align:center;padding-top:4px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#b46b80;font-weight:800}.title{font-size:28px;font-weight:900;margin:6px 0 3px}.sub{font-size:14px;color:var(--muted);margin:0}
.gift-stage{height:225px;position:relative;display:grid;place-items:center;margin:8px 0 2px;perspective:900px}
.spark{position:absolute;border-radius:50%;background:#ffd76a;box-shadow:0 0 12px #ffd76a;animation:float 2.8s ease-in-out infinite}.s1{width:7px;height:7px;top:42px;left:24%;animation-delay:.1s}.s2{width:5px;height:5px;top:74px;right:22%;animation-delay:.7s}.s3{width:8px;height:8px;bottom:35px;left:20%;animation-delay:1.2s}.s4{width:5px;height:5px;bottom:55px;right:18%;animation-delay:1.8s}
.gift{width:128px;height:108px;position:relative;transform-style:preserve-3d;animation:giftFloat 2.2s ease-in-out infinite;filter:drop-shadow(0 20px 18px rgba(184,89,116,.22))}.gift .box{position:absolute;left:8px;right:8px;bottom:4px;height:78px;border-radius:12px 12px 16px 16px;background:linear-gradient(135deg,#ff86a9,#ff4f7d);box-shadow:inset 9px 0 0 rgba(255,255,255,.16),inset -8px -8px 0 rgba(166,38,76,.08)}.gift .lid{position:absolute;left:2px;top:23px;width:124px;height:29px;border-radius:10px;background:linear-gradient(135deg,#ff9bb8,#ff5d8a);z-index:3;transform:rotate(-1deg)}.gift .ribbon-v{position:absolute;width:18px;top:0;bottom:0;left:55px;background:#ffd76a;z-index:4;border-radius:4px}.gift .ribbon-h{position:absolute;height:13px;left:0;right:0;top:28px;background:#ffd76a;z-index:4}.bow{position:absolute;z-index:6;top:0;left:47px;width:38px;height:30px}.bow:before,.bow:after{content:"";position:absolute;width:25px;height:20px;border:6px solid #ffd76a;border-radius:50% 60% 50% 50%;top:2px}.bow:before{left:-11px;transform:rotate(-24deg)}.bow:after{right:-11px;transform:rotate(24deg)}
.card{background:rgba(255,255,255,.88);border:1px solid #f5dce4;border-radius:26px;padding:20px;box-shadow:0 12px 40px rgba(188,83,116,.10);backdrop-filter:blur(10px)}
.label{text-align:center;font-weight:900;font-size:16px}.hint{text-align:center;font-size:13px;color:#9b9298;margin:7px 0 16px}.slots{display:flex;justify-content:center;gap:10px;margin-bottom:16px}.slot{-webkit-appearance:none;appearance:none;width:68px;height:70px;border:2px solid #ead9df;border-radius:18px;background:#fff;text-align:center;font-size:30px;font-weight:900;color:#302b30;outline:none;caret-color:var(--pink);-webkit-user-select:text;user-select:text;box-shadow:0 5px 14px rgba(130,70,90,.06);transition:.18s}.slot:focus{border-color:var(--pink);box-shadow:0 0 0 5px rgba(255,92,138,.12)}
.submit{display:block;width:100%;height:54px;border:0;border-radius:17px;background:linear-gradient(135deg,#ff6f98,#ff4f7d);color:#fff;font-size:17px;font-weight:900;box-shadow:0 10px 20px rgba(255,79,125,.24);cursor:pointer}.submit:active{transform:scale(.98)}.message{min-height:22px;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:#d44770}.message.ok{color:#2c9b6d}.message.bad{color:#d44770}
.history{margin-top:16px}.history-title{font-size:12px;color:#a29aa0;font-weight:800;margin-bottom:8px}.guess{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:14px;background:#fff;border:1px solid #f2e2e7;margin-bottom:7px;font-size:14px}.guess .word{font-weight:900;letter-spacing:.08em}.score{font-weight:900;color:#c65372}.empty{text-align:center;color:#b2aab0;font-size:13px;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(37,24,30,.76);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.overlay.show{display:flex}.success{width:min(100%,480px);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#fff,#fff7fa);border-radius:30px;padding:22px 18px 28px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.28);position:relative}.success h2{font-size:31px;margin:0 0 5px}.success p{margin:0;color:#8b8188}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:30px}.confetti i{position:absolute;width:8px;height:14px;top:-20px;animation:confetti 2.2s linear forwards;opacity:.9}.reveal-area{height:330px;display:grid;place-items:center;perspective:1200px;overflow:hidden;position:relative}.reveal-area:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,106,.34),rgba(255,255,255,0) 68%);filter:blur(2px);animation:halo 2.8s ease-in-out infinite}.phone3d{width:154px;height:300px;position:relative;transform-style:preserve-3d;animation:spin4d 7s linear infinite;cursor:grab;touch-action:none;will-change:transform;filter:drop-shadow(0 28px 22px rgba(0,0,0,.25));transition:filter .2s}.phone3d:before{content:"";position:absolute;inset:-9px;border-radius:31px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,0) 38%,rgba(255,92,138,.25) 65%,rgba(255,215,106,.7));transform:translateZ(-3px);filter:blur(2px);opacity:.8}.phone-face{position:absolute;inset:0;border-radius:27px;border:6px solid #202124;background:#f8f8f8;overflow:hidden;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 16px 32px rgba(0,0,0,.25);transform-style:preserve-3d}.phone-face.front{background:#fff;transform:translateZ(10px)}.phone-face.front img{width:100%;height:100%;object-fit:cover;display:block}.phone-face.front:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 45%,transparent 62%);mix-blend-mode:screen;animation:shine 2.8s ease-in-out infinite}.phone-face.back{transform:rotateY(180deg) translateZ(10px);background:radial-gradient(circle at 30% 20%,#fff,#d6d6d6 45%,#999);display:grid;place-items:center}.phone-face.back:after{content:"TOYSELECT  •  4D";font-weight:900;letter-spacing:.12em;color:#777;font-size:10px}.phone-face.top,.phone-face.bottom,.phone-face.leftFace,.phone-face.rightFace{background:linear-gradient(90deg,#777,#eee,#8b8b8b);border:0;backface-visibility:visible}.phone-face.top{height:20px;inset:auto 10px auto 10px;top:-5px;transform:rotateX(90deg) translateZ(10px)}.phone-face.bottom{height:20px;inset:auto 10px  -5px 10px;transform:rotateX(-90deg) translateZ(10px)}.phone-face.leftFace{width:20px;inset:10px auto 10px -5px;transform:rotateY(-90deg) translateZ(10px)}.phone-face.rightFace{width:20px;inset:10px -5px 10px auto;transform:rotateY(90deg) translateZ(10px)}.edge{position:absolute;top:9px;bottom:9px;width:10px;background:linear-gradient(90deg,#666,#f4f4f4,#777);border-radius:8px;transform-style:preserve-3d;box-shadow:0 0 8px rgba(255,255,255,.35)}.edge.left{left:-5px;transform:translateZ(0)}.edge.right{right:-5px}.phone3d.dragging{animation:none;cursor:grabbing;filter:drop-shadow(0 34px 28px rgba(0,0,0,.32))}.answer{font-size:18px;font-weight:900;color:#c5476d;margin-top:2px}.hint-drag{font-size:12px;color:#aaa;margin-top:2px}.mode4d{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:5px 10px;border-radius:999px;background:#29242a;color:#fff;font-size:10px;font-weight:900;letter-spacing:.12em}.again{margin-top:14px;width:100%;height:50px;border:0;border-radius:16px;background:#29242a;color:#fff;font-weight:900;font-size:16px}
.burst{position:absolute;inset:0;pointer-events:none;display:none}.burst.show{display:block}.burst:before,.burst:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:180px;background:#ffd76a;transform:translate(-50%,-50%);box-shadow:0 -105px 0 #ff7197,0 105px 0 #7bc8ff;animation:burst .9s ease-out forwards}.burst:after{transform:translate(-50%,-50%) rotate(90deg);box-shadow:0 -105px 0 #9fe58d,0 105px 0 #ff9ed0}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.15);opacity:1}}@keyframes shine{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}@keyframes spin4d{0%{transform:rotateY(0deg) rotateX(-5deg) rotateZ(-1deg) translateZ(0)}25%{transform:rotateY(90deg) rotateX(7deg) rotateZ(1deg) translateZ(18px)}50%{transform:rotateY(180deg) rotateX(-4deg) rotateZ(-1deg) translateZ(0)}75%{transform:rotateY(270deg) rotateX(7deg) rotateZ(1deg) translateZ(18px)}100%{transform:rotateY(360deg) rotateX(-5deg) rotateZ(-1deg) translateZ(0)}}@keyframes giftFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-14px);opacity:1}}@keyframes spin{from{transform:rotateY(0deg) rotateX(-3deg)}to{transform:rotateY(360deg) rotateX(-3deg)}}@keyframes confetti{to{top:110%;transform:rotate(620deg) translateX(35px)}}@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.gift-stage{height:205px}.slot{width:62px;height:64px}.reveal-area{height:285px}.phone3d{width:132px;height:260px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="eyebrow">BIRTHDAY SURPRISE</div><div class="title">猜猜我的生日禮物 🎁</div><p class="sub">三個字，猜中就能打開神秘禮物</p></header>
  <section class="gift-stage" aria-label="會動的禮物盒">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <div class="gift" id="gift"><div class="box"><div class="ribbon-v"></div></div><div class="lid"><div class="ribbon-h"></div></div><div class="bow"></div></div>
  </section>
  <main class="card">
    <div class="label">輸入你的答案</div>
    <div class="hint">A＝字和位置都對　・　B＝字對但位置錯</div>
    <div class="slots" id="slots">
      <input class="slot" id="s0" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="第一個字">
      <input class="slot" id="s1" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="第二個字">
      <input class="slot" id="s2" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="第三個字">
    </div>
    <button class="submit" id="submit" type="button">送出答案 ✨</button>
    <div class="message" id="message"></div>
    <div class="history"><div class="history-title">猜測紀錄</div><div id="history"><div class="empty">還沒有猜測，試試看！</div></div></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="success">
    <div class="confetti" id="confetti"></div><div class="burst" id="burst"></div>
    <h2>🎉 答對了！</h2><p>你的答案</p><div class="answer">手機殼 · 3A 0B</div><div class="mode4d">✦ 4D INTERACTIVE CASE ✦</div>
    <div class="reveal-area"><div class="phone3d" id="phone3d">
      <div class="phone-face front"><img id="caseImg" alt="生日禮物手機殼"></div>
      <div class="phone-face back"></div>
      <div class="phone-face top"></div><div class="phone-face bottom"></div><div class="phone-face leftFace"></div><div class="phone-face rightFace"></div>
      <div class="edge left"></div><div class="edge right"></div>
    </div></div>
    <div class="hint-drag">手機殼會自動 360° 旋轉，也可以用手指左右拖曳 👆</div>
    <button class="again" id="again" type="button">再猜一次</button>
  </div>
</div>

  function value(){ return inputs.map(x=>x.value.trim()).join(''); }
  function clear(){ inputs.forEach(x=>x.value=''); inputs[0].focus({preventScroll:true}); }
  function calc(guess){
    let a=0,b=0; const usedA=[false,false,false], usedG=[false,false,false];
    for(let i=0;i<3;i++){ if(guess[i]===ANSWER[i]){a++;usedA[i]=true;usedG[i]=true;} }
    for(let i=0;i<3;i++) if(!usedG[i]) for(let j=0;j<3;j++) if(!usedA[j]&&guess[i]===ANSWER[j]){b++;usedA[j]=true;break;}
    return {a,b};
  }
  function addHistory(g,a,b){
    const empty=history.querySelector('.empty'); if(empty) empty.remove();
    const row=document.createElement('div'); row.className='guess';
    const w=document.createElement('span'); w.className='word'; w.textContent=g;
    const sc=document.createElement('span'); sc.className='score'; sc.textContent=a+'A '+b+'B';
    row.append(w,sc); history.prepend(row);
  }
  function setMsg(text,ok){message.textContent=text;message.className='message '+(ok?'ok':'bad');}
  function confettiStart(){
    confetti.innerHTML=''; const shapes=['#ff5c8a','#ffd76a','#7bc8ff','#9fe58d','#c7a0ff'];
    for(let i=0;i<38;i++){const el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.animationDelay=(Math.random()*.55)+'s';el.style.transform='rotate('+(Math.random()*360)+'deg)';el.style.background=shapes[i%shapes.length];confetti.appendChild(el);}
  }
  function win(){
    locked=true; setMsg('🎉 完全正確！正在打開生日禮物…',true); burst.classList.add('show'); confettiStart();
    setTimeout(()=>overlay.classList.add('show'),550);
  }
  function submitGuess(){
    if(locked) return;
    const g=value();
    if(g.length!==3){ setMsg('請把三個格子都填滿再送出喔！',false); return; }
    const r=calc(g); addHistory(g,r.a,r.b);
    if(r.a===3){ win(); }
    else { setMsg('收到！ '+r.a+'A '+r.b+'B，繼續猜猜看 ✨',false); clear(); }
  }

  inputs.forEach((el,i)=>{
    // IMPORTANT: Chinese/Japanese/Korean keyboards use IME composition.
    // Do not move focus while the IME is still composing, otherwise mobile
    // browsers lose the composition box and the user cannot finish typing.
    let composing=false;

    el.addEventListener('compositionstart',()=>{ composing=true; });

    function commitInput(){
      if(composing) return;
      const value=el.value || '';
      if(!value) return;

      // A slot represents exactly one character. Array.from handles Unicode
      // characters more safely than value.length.
      const chars=Array.from(value);
      if(chars.length>1){
        chars.slice(0,3-i).forEach((ch,k)=>inputs[i+k].value=ch);
        inputs[Math.min(i+chars.length,2)].focus({preventScroll:true});
      }else if(i<2){
        inputs[i+1].focus({preventScroll:true});
      }
    }

    el.addEventListener('compositionend',()=>{
      composing=false;
      // Let the browser finish committing the IME text before moving focus.
      requestAnimationFrame(commitInput);
    });

    el.addEventListener('input',()=>{
      // While composing, the value may contain partial Zhuyin/IME text.
      // Waiting here fixes the mobile input problem.
      if(!composing) commitInput();
    });

    el.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !el.value && i>0){
        inputs[i-1].focus({preventScroll:true});
        inputs[i-1].value='';
        e.preventDefault();
      }
      else if(e.key==='ArrowLeft' && i>0){inputs[i-1].focus({preventScroll:true});e.preventDefault();}
      else if(e.key==='ArrowRight' && i<2){inputs[i+1].focus({preventScroll:true});e.preventDefault();}
      else if(e.key==='Enter'){e.preventDefault();submitGuess();}
    });

    el.addEventListener('paste', function(e){
      const txt=(e.clipboardData||window.clipboardData).getData('text');
      if(!txt) return;
      e.preventDefault();
      const chars=Array.from(txt).slice(0,3-i);
      chars.forEach((ch,k)=>inputs[i+k].value=ch);
      inputs[Math.min(i+chars.length,2)].focus({preventScroll:true});
    });
  });
  submit.addEventListener('click', submitGuess);
  document.getElementById('again').addEventListener('click',()=>{overlay.classList.remove('show');burst.classList.remove('show');locked=false;clear();setMsg('','');});

  // 4D mobile interaction: drag + device motion/parallax.
  let tiltX=0, tiltY=0;
  function renderPhone(){
    phone.style.transform='rotateY('+rotation+'deg) rotateX('+(-4+tiltY*.18)+'deg) rotateZ('+(tiltX*.05)+'deg) translateZ('+(Math.abs(tiltY)*0.7)+'px)';
  }
  phone.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;phone.classList.add('dragging');phone.setPointerCapture(e.pointerId);});
  phone.addEventListener('pointermove',e=>{if(!drag)return;rotation+=(e.clientX-startX)*0.75;startX=e.clientX;renderPhone();});
  function endDrag(){drag=false;phone.classList.remove('dragging');}
  phone.addEventListener('pointerup',endDrag); phone.addEventListener('pointercancel',endDrag);
  // On supported phones, tilt the case subtly with the device. iOS asks for permission only after a tap.
  function enableMotion(){
    const handler=e=>{tiltX=Math.max(-25,Math.min(25,e.gamma||0));tiltY=Math.max(-25,Math.min(25,e.beta||0));if(!drag)renderPhone();};
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(state=>{if(state==='granted')window.addEventListener('deviceorientation',handler,true)}).catch(()=>{});
    }else if('DeviceOrientationEvent' in window){window.addEventListener('deviceorientation',handler,true);}
  }
  overlay.addEventListener('click',()=>{ if(!drag) enableMotion(); },{once:true});
  phone.addEventListener('click',enableMotion,{once:true});
  renderPhone();
})();
</script>
