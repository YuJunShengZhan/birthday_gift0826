<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>予君的生日禮物🎁</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff5c8a;--pink2:#ff8fb0;--ink:#27242a;--muted:#8e8991;--card:#fff;--bg:#fff7fa}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 50% -10%,#fff 0,#fff7fa 48%,#ffeef4 100%);color:var(--ink)}
body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px calc(28px + env(safe-area-inset-bottom));position:relative}
.top{text-align:center;padding-top:4px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#b46b80;font-weight:800}.title{font-size:28px;font-weight:900;margin:6px 0 3px}.sub{font-size:14px;color:var(--muted);margin:0}
.gift-stage{height:225px;position:relative;display:grid;place-items:center;margin:8px 0 2px;perspective:900px}
.spark{position:absolute;border-radius:50%;background:#ffd76a;box-shadow:0 0 12px #ffd76a;animation:float 2.8s ease-in-out infinite}.s1{width:7px;height:7px;top:42px;left:24%;animation-delay:.1s}.s2{width:5px;height:5px;top:74px;right:22%;animation-delay:.7s}.s3{width:8px;height:8px;bottom:35px;left:20%;animation-delay:1.2s}.s4{width:5px;height:5px;bottom:55px;right:18%;animation-delay:1.8s}
.gift{width:128px;height:108px;position:relative;transform-style:preserve-3d;animation:giftFloat 2.2s ease-in-out infinite;filter:drop-shadow(0 20px 18px rgba(184,89,116,.22))}.gift .box{position:absolute;left:8px;right:8px;bottom:4px;height:78px;border-radius:12px 12px 16px 16px;background:linear-gradient(135deg,#ff86a9,#ff4f7d);box-shadow:inset 9px 0 0 rgba(255,255,255,.16),inset -8px -8px 0 rgba(166,38,76,.08)}.gift .lid{position:absolute;left:2px;top:23px;width:124px;height:29px;border-radius:10px;background:linear-gradient(135deg,#ff9bb8,#ff5d8a);z-index:3;transform:rotate(-1deg)}.gift .ribbon-v{position:absolute;width:18px;top:0;bottom:0;left:55px;background:#ffd76a;z-index:4;border-radius:4px}.gift .ribbon-h{position:absolute;height:13px;left:0;right:0;top:28px;background:#ffd76a;z-index:4}.bow{position:absolute;z-index:6;top:0;left:47px;width:38px;height:30px}.bow:before,.bow:after{content:"";position:absolute;width:25px;height:20px;border:6px solid #ffd76a;border-radius:50% 60% 50% 50%;top:2px}.bow:before{left:-11px;transform:rotate(-24deg)}.bow:after{right:-11px;transform:rotate(24deg)}
.card{background:rgba(255,255,255,.88);border:1px solid #f5dce4;border-radius:26px;padding:20px;box-shadow:0 12px 40px rgba(188,83,116,.10);backdrop-filter:blur(10px)}
.label{text-align:center;font-weight:900;font-size:16px}.hint{text-align:center;font-size:13px;color:#9b9298;margin:7px 0 16px}.slots{display:flex;justify-content:center;gap:10px;margin-bottom:16px}.slot{-webkit-appearance:none;appearance:none;width:68px;height:70px;border:2px solid #ead9df;border-radius:18px;background:#fff;text-align:center;font-size:30px;font-weight:900;color:#302b30;outline:none;caret-color:var(--pink);-webkit-user-select:text;user-select:text;box-shadow:0 5px 14px rgba(130,70,90,.06);transition:.18s}.slot:focus{border-color:var(--pink);box-shadow:0 0 0 5px rgba(255,92,138,.12)}
.answer-input-wrap{margin:0 0 16px}.answer-input{-webkit-appearance:none;appearance:none;width:100%;height:62px;border:2px solid #ead9df;border-radius:18px;background:#fff;padding:0 18px;text-align:center;font-size:25px;letter-spacing:.32em;font-weight:900;color:#302b30;outline:none;caret-color:var(--pink);-webkit-user-select:text;user-select:text;box-shadow:0 5px 14px rgba(130,70,90,.06);transition:.18s}.answer-input::placeholder{letter-spacing:0;font-size:16px;color:#b8b0b6;font-weight:700}.answer-input:focus{border-color:var(--pink);box-shadow:0 0 0 5px rgba(255,92,138,.12)}.submit{display:block;width:100%;height:54px;border:0;border-radius:17px;background:linear-gradient(135deg,#ff6f98,#ff4f7d);color:#fff;font-size:17px;font-weight:900;box-shadow:0 10px 20px rgba(255,79,125,.24);cursor:pointer}.submit:active{transform:scale(.98)}.message{min-height:22px;text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:#d44770}.message.ok{color:#2c9b6d}.message.bad{color:#d44770}
.history{margin-top:16px}.history-title{font-size:12px;color:#a29aa0;font-weight:800;margin-bottom:8px}.guess{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:14px;background:#fff;border:1px solid #f2e2e7;margin-bottom:7px;font-size:14px}.guess .word{font-weight:900;letter-spacing:.08em}.score{font-weight:900;color:#c65372}.empty{text-align:center;color:#b2aab0;font-size:13px;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(37,24,30,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.overlay.show{display:flex}.success{width:min(100%,430px);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#fff,#fff8fa);border-radius:30px;padding:26px 20px 24px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.28);position:relative}.success h2{font-size:31px;margin:0 0 6px}.success p{margin:0;color:#8b8188}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:30px}.confetti i{position:absolute;width:8px;height:14px;top:-20px;animation:confetti 2.2s linear forwards;opacity:.9}.reveal-area{min-height:440px;display:grid;place-items:center;overflow:hidden;position:relative;margin:8px 0}.case-reveal{width:min(82vw,300px);height:auto;max-height:64vh;object-fit:contain;display:block;filter:drop-shadow(0 18px 22px rgba(0,0,0,.18));animation:casePop .7s cubic-bezier(.2,.9,.25,1.15) both}.case-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,106,.32),rgba(255,255,255,0) 70%);filter:blur(3px);z-index:-1}.answer{font-size:18px;font-weight:900;color:#c5476d;margin-top:4px}.again{margin-top:8px;width:100%;height:50px;border:0;border-radius:16px;background:#29242a;color:#fff;font-weight:900;font-size:16px}.burst{position:absolute;inset:0;pointer-events:none;display:none}.burst.show{display:block}.burst:before,.burst:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:180px;background:#ffd76a;transform:translate(-50%,-50%);box-shadow:0 -105px 0 #ff7197,0 105px 0 #7bc8ff;animation:burst .9s ease-out forwards}.burst:after{transform:translate(-50%,-50%) rotate(90deg);box-shadow:0 -105px 0 #9fe58d,0 105px 0 #ff9ed0}
@keyframes casePop{0%{opacity:0;transform:scale(.7) translateY(22px)}100%{opacity:1;transform:scale(1) translateY(0)}}@keyframes halo{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.15);opacity:1}}@keyframes shine{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}@keyframes spin4d{0%{transform:rotateY(0deg) rotateX(-5deg) rotateZ(-1deg) translateZ(0)}25%{transform:rotateY(90deg) rotateX(7deg) rotateZ(1deg) translateZ(18px)}50%{transform:rotateY(180deg) rotateX(-4deg) rotateZ(-1deg) translateZ(0)}75%{transform:rotateY(270deg) rotateX(7deg) rotateZ(1deg) translateZ(18px)}100%{transform:rotateY(360deg) rotateX(-5deg) rotateZ(-1deg) translateZ(0)}}@keyframes giftFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-14px);opacity:1}}@keyframes spin{from{transform:rotateY(0deg) rotateX(-3deg)}to{transform:rotateY(360deg) rotateX(-3deg)}}@keyframes confetti{to{top:110%;transform:rotate(620deg) translateX(35px)}}@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.gift-stage{height:205px}.slot{width:62px;height:64px}.reveal-area{height:285px}}

/* Responsive layout: phones, tablets and desktops */
html{font-size:16px}
.app{width:min(100%,720px);padding-left:clamp(12px,3vw,28px);padding-right:clamp(12px,3vw,28px)}
.card{width:100%;padding:clamp(18px,4vw,30px);border-radius:clamp(22px,3vw,30px)}
.title{font-size:clamp(24px,5vw,34px);line-height:1.2}
.sub{font-size:clamp(13px,2.5vw,16px)}
.gift-stage{height:clamp(190px,30vw,260px)}
.answer-input{height:clamp(58px,9vw,70px);font-size:clamp(20px,4vw,28px)}
.submit{height:clamp(52px,8vw,60px);font-size:clamp(16px,2.5vw,18px)}
.history,.guess{width:100%}
.overlay{padding:clamp(10px,4vw,28px)}
.success{width:min(100%,520px);max-height:calc(100dvh - 20px);padding:clamp(18px,5vw,32px);border-radius:clamp(24px,4vw,34px)}
.success h2{font-size:clamp(26px,6vw,38px)}
.reveal-area{height:clamp(280px,65vw,420px)}
.case-reveal{max-width:min(92vw,320px);max-height:min(60dvh,430px);object-fit:contain}
@media (min-width:768px){
  .app{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:8px;padding-top:28px;padding-bottom:28px}
  .gift-stage{margin:0}
  .card{box-shadow:0 16px 50px rgba(188,83,116,.12)}
}
@media (min-width:1024px){
  body{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .app{width:min(100%,760px);min-height:auto}
}
@media (max-width:420px){
  .top{padding-top:0}.gift-stage{height:180px}.gift{transform:scale(.88)}
  .answer-input{letter-spacing:.18em}.answer-input::placeholder{font-size:14px}
  .guess{padding:10px 11px}.score{white-space:nowrap}
}
@media (max-width:340px){
  .app{padding-left:10px;padding-right:10px}.card{padding:16px 14px}.title{font-size:23px}
  .gift-stage{height:165px}.success{padding:16px 12px}.reveal-area{height:250px}
}
@media (max-height:700px) and (min-width:700px){
  .gift-stage{height:170px}.reveal-area{height:300px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* Birthday celebration */
.celebrate-btn{margin-top:14px;width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,#ff7ca2,#ff477d);color:#fff;font-weight:900;font-size:17px;box-shadow:0 12px 28px rgba(255,71,125,.25);cursor:pointer;transition:transform .18s,filter .18s}.celebrate-btn:active{transform:scale(.97);filter:brightness(.96)}
.birthday-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:clamp(14px,4vw,32px);background:radial-gradient(circle at 50% 45%,rgba(255,128,165,.18),rgba(14,10,30,.94) 68%);overflow:hidden}.birthday-overlay.show{display:flex;animation:birthdayFade .35s ease-out}.birthday-card{position:relative;z-index:2;width:min(92vw,560px);padding:clamp(28px,6vw,52px) clamp(18px,5vw,42px) clamp(24px,5vw,38px);border-radius:32px;text-align:center;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.35);box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cake-stage{position:relative;width:220px;height:180px;margin:0 auto 18px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.28));animation:cakePop .7s cubic-bezier(.2,.9,.25,1.35) both}.cake-plate{position:absolute;left:14px;right:14px;bottom:0;height:18px;border-radius:50%;background:linear-gradient(#f7e7ee,#cfd5ff);box-shadow:0 8px 12px rgba(0,0,0,.18)}.cake-layer{position:absolute;left:28px;right:28px;border-radius:22px;background:linear-gradient(135deg,#ffb0c8,#ff6d9b);border:4px solid rgba(255,255,255,.35);box-shadow:inset 0 -12px 0 rgba(167,35,80,.12)}.bottom-layer{height:66px;bottom:16px}.top-layer{left:45px;right:45px;height:52px;bottom:74px;background:linear-gradient(135deg,#ffd9a4,#ff9b7d)}.cake-cream{position:absolute;left:42px;right:42px;bottom:114px;height:24px;border-radius:50% 50% 42% 42%;background:#fff7f0;box-shadow:0 11px 0 #fff7f0,18px 15px 0 -3px #fff7f0,-18px 15px 0 -3px #fff7f0}.cake-candle{position:absolute;left:calc(50% - 8px);bottom:137px;width:16px;height:47px;border-radius:8px;background:repeating-linear-gradient(45deg,#fff 0 6px,#ff6e9e 6px 12px);box-shadow:0 2px 8px rgba(0,0,0,.18)}.cake-flame{position:absolute;z-index:2;left:calc(50% - 12px);bottom:177px;width:24px;height:34px;border-radius:55% 45% 60% 40%;background:radial-gradient(circle at 40% 35%,#fff8b5 0 18%,#ffd34d 22% 55%,#ff8c45 56% 100%);transform:rotate(45deg);box-shadow:0 0 24px 8px rgba(255,190,64,.62);animation:flame .65s ease-in-out infinite alternate}.birthday-text{font-size:clamp(30px,7vw,48px);line-height:1.18;font-weight:1000;letter-spacing:.02em;text-shadow:0 4px 20px rgba(255,119,164,.55)}.birthday-sub{margin:14px auto 0;max-width:420px;font-size:clamp(14px,3vw,18px);line-height:1.7;color:rgba(255,255,255,.9)}.countdown{margin:18px auto 16px;font-size:13px;font-weight:800;color:#ffd97a}.close-birthday{width:min(100%,300px);min-height:50px;border:0;border-radius:16px;background:#fff;color:#d94d7d;font-size:16px;font-weight:900;cursor:pointer}.fireworks{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:20}.birthday-card{position:relative;z-index:2}.rocket{position:absolute;left:var(--x);bottom:-18px;width:5px;height:16px;border-radius:999px;background:linear-gradient(to top,#fff,var(--c));box-shadow:0 0 14px 4px var(--c);transform:translateX(-50%);animation:rocketShoot var(--dur) cubic-bezier(.18,.75,.38,1) forwards}.rocket:after{content:"";position:absolute;left:50%;top:100%;width:3px;height:42px;transform:translateX(-50%);background:linear-gradient(to bottom,var(--c),rgba(255,255,255,.35),transparent);filter:blur(1px);opacity:.9}.firework{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);left:var(--x);top:var(--y);box-shadow:0 0 10px var(--c);animation:explode 1.5s ease-out forwards}.firework:before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:var(--shadow);animation:trail 1.5s ease-out forwards}.firework:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;border:2px solid var(--c);transform:translate(-50%,-50%);animation:ring 1.1s ease-out forwards}.birthday-overlay.show .firework,.birthday-overlay.show .rocket{animation-play-state:running}@keyframes birthdayFade{from{opacity:0}to{opacity:1}}@keyframes cakePop{from{opacity:0;transform:scale(.45) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes flame{from{transform:rotate(43deg) scale(.94)}to{transform:rotate(48deg) scale(1.08)}}@keyframes rocketShoot{0%{transform:translate(-50%,0) scale(.8);opacity:0}8%{opacity:1}78%{opacity:1}100%{transform:translate(calc(-50% + var(--drift)),calc(-1 * var(--rise))) scale(1.05);opacity:1}}@keyframes explode{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4);opacity:0}}@keyframes trail{0%{opacity:1}100%{opacity:0;transform:scale(1.05)}}@keyframes ring{0%{opacity:1;width:8px;height:8px}100%{opacity:0;width:110px;height:110px}}
@media (max-width:420px){.birthday-card{border-radius:26px}.cake-stage{transform:scale(.9);margin-top:-8px;margin-bottom:8px}.birthday-text{font-size:30px}.birthday-sub{font-size:14px}}

</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="eyebrow">BIRTHDAY SURPRISE</div><div class="title">猜猜我的生日禮物 🎁</div><p class="sub">三個字，猜中就能打開神秘禮物</p></header>
  <section class="gift-stage" aria-label="會動的禮物盒">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <div class="gift" id="gift"><div class="box"><div class="ribbon-v"></div></div><div class="lid"><div class="ribbon-h"></div></div><div class="bow"></div></div>
  </section>
  <main class="card">
    <div class="label">輸入你的答案</div>
    <div class="answer-input-wrap">
      <input class="answer-input" id="answerInput" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="3" placeholder="請輸入完整的三個字答案再送出喔！" aria-label="輸入三個字的答案">
    </div>
    <button class="submit" id="submit" type="button">送出答案 ✨</button>
    <div class="message" id="message"></div>
    <div class="history"><div class="history-title">猜測紀錄</div><div id="history"><div class="empty">還沒有猜測，試試看！</div></div></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="success">
    <div class="confetti" id="confetti"></div><div class="burst" id="burst"></div>
    <h2>🎉 答對了！</h2><p>猜中生日禮物了</p><div class="answer">手機殼</div>
    <div class="reveal-area"><div class="case-glow"></div><img class="case-reveal" id="caseImg" alt="猜中的生日禮物手機殼"></div>
    <button class="celebrate-btn" id="celebrateBtn" type="button">🎂 點我領取生日祝福</button>
    <button class="again" id="again" type="button">關閉</button>
  </div>
</div>

<div class="birthday-overlay" id="birthdayOverlay" aria-hidden="true">
  <div class="fireworks" id="fireworks"></div>
  <div class="birthday-card">
    <div class="cake-stage" aria-hidden="true">
      <div class="cake-flame"></div>
      <div class="cake-candle"></div>
      <div class="cake-cream"></div>
      <div class="cake-layer top-layer"></div>
      <div class="cake-layer bottom-layer"></div>
      <div class="cake-plate"></div>
    </div>
    <div class="birthday-text">祝予君20歲生日快樂!</div>
    <div class="birthday-sub">願新的一歲，平安、快樂，所有期待都如願 ✨</div>
    <div class="countdown" id="fireworkStatus">煙火施放中 · 10 秒</div>
    <button class="close-birthday" id="closeBirthday" type="button">收下祝福 ❤️</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const ANSWER = ['手','機','殼'];
  const answerInput = document.getElementById('answerInput');
  const submit = document.getElementById('submit');
  const message = document.getElementById('message');
  const history = document.getElementById('history');
  const overlay = document.getElementById('overlay');
  const burst = document.getElementById('burst');
  const confetti = document.getElementById('confetti');
  const caseImg = document.getElementById('caseImg');

  function value(){ return Array.from((answerInput.value||'').trim()).slice(0,3).join(''); }
  function clear(){ answerInput.value=''; answerInput.focus({preventScroll:true}); }
  function calc(guess){
    let a=0,b=0; const usedA=[false,false,false], usedG=[false,false,false];
    for(let i=0;i<3;i++){ if(guess[i]===ANSWER[i]){a++;usedA[i]=true;usedG[i]=true;} }
    for(let i=0;i<3;i++) if(!usedG[i]) for(let j=0;j<3;j++) if(!usedA[j]&&guess[i]===ANSWER[j]){b++;usedA[j]=true;break;}
    return {a,b};
  }
  function addHistory(g,a,b){
    const empty=history.querySelector('.empty'); if(empty) empty.remove();
    const row=document.createElement('div'); row.className='guess';
    const w=document.createElement('span'); w.className='word'; w.textContent=g;
    const sc=document.createElement('span'); sc.className='score'; sc.textContent=a+'A '+b+'B';
    row.append(w,sc); history.prepend(row);
  }
  function setMsg(text,ok){message.textContent=text;message.className='message '+(ok?'ok':'bad');}
  function confettiStart(){
    confetti.innerHTML=''; const shapes=['#ff5c8a','#ffd76a','#7bc8ff','#9fe58d','#c7a0ff'];
    for(let i=0;i<38;i++){const el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.animationDelay=(Math.random()*.55)+'s';el.style.transform='rotate('+(Math.random()*360)+'deg)';el.style.background=shapes[i%shapes.length];confetti.appendChild(el);}
  }
  function win(){
    locked=true; setMsg('🎉 完全正確！正在打開生日禮物…',true); burst.classList.add('show'); confettiStart();
    setTimeout(()=>overlay.classList.add('show'),550);
  }
  function submitGuess(){
    if(locked) return;
    const g=value();
    if(g.length!==3){ setMsg('請輸入完整的三個字答案再送出喔！',false); return; }
    const r=calc(g);
    if(r.a===3){ win(); }
    else { addHistory(g,r.a,r.b); setMsg('收到！ '+r.a+'A '+r.b+'B，繼續猜猜看 ✨',false); clear(); }
  }

  let composing=false;
  answerInput.addEventListener('compositionstart',()=>{composing=true;});
  answerInput.addEventListener('compositionend',()=>{composing=false;});
  answerInput.addEventListener('input',()=>{
    if(composing) return;
    const chars=Array.from(answerInput.value||'').slice(0,3);
    if(chars.length< Array.from(answerInput.value||'').length) answerInput.value=chars.join('');
  });
  answerInput.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !composing){e.preventDefault();submitGuess();}
  });
  answerInput.addEventListener('paste',e=>{
    const txt=(e.clipboardData||window.clipboardData).getData('text');
    if(!txt) return;
    e.preventDefault();
    answerInput.value=Array.from(txt.trim()).slice(0,3).join('');
  });
  submit.addEventListener('click', submitGuess);
  document.getElementById('again').addEventListener('click',()=>{overlay.classList.remove('show');burst.classList.remove('show');locked=false;clear();setMsg('','');});

  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.classList.remove('show'); });

  let fireworkTimer=null, statusTimer=null, fireworkEnd=0;
  const fireworkColors=['#ff6b9a','#ffd65c','#7ce6ff','#b58cff','#89f7b0','#ff9d66','#ffffff'];
  function burstFirework(x,y,color){
    const el=document.createElement('i');
    const shadows=[];
    for(let i=0;i<24;i++){
      const a=(Math.PI*2*i/24)+(Math.random()*.12);
      const d=70+Math.random()*95;
      shadows.push(`${Math.cos(a)*d}px ${Math.sin(a)*d}px 2px ${color}`);
    }
    el.className='firework';
    el.style.setProperty('--x',x+'%');
    el.style.setProperty('--y',y+'%');
    el.style.setProperty('--c',color);
    el.style.setProperty('--shadow',shadows.join(','));
    fireworks.appendChild(el);
    setTimeout(()=>el.remove(),1600);
  }
  // Web Audio：用濾波雜訊、低頻衝擊與短暫高頻「咻」聲模擬較自然的煙火。
  let audioCtx=null, lastLaunchSound=0;
  function ensureAudio(){
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }
  function makeNoiseBuffer(ctx,seconds){
    const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*seconds),ctx.sampleRate);
    const data=buffer.getChannelData(0);
    let last=0;
    for(let i=0;i<data.length;i++){
      const white=Math.random()*2-1;
      last=last*.985+white*.15;
      data[i]=last;
    }
    return buffer;
  }
  function playLaunchSound(){
    const now=Date.now();
    if(now-lastLaunchSound<85) return;
    lastLaunchSound=now;
    try{
      const ctx=ensureAudio(), t=ctx.currentTime;
      const master=ctx.createGain();
      master.gain.setValueAtTime(.0001,t);
      master.gain.exponentialRampToValueAtTime(.055,t+.012);
      master.gain.exponentialRampToValueAtTime(.0001,t+.24);
      master.connect(ctx.destination);

      const src=ctx.createBufferSource();
      src.buffer=makeNoiseBuffer(ctx,.26);
      const filter=ctx.createBiquadFilter();
      filter.type='bandpass';
      filter.Q.value=1.2;
      filter.frequency.setValueAtTime(450,t);
      filter.frequency.exponentialRampToValueAtTime(2200,t+.19);
      src.connect(filter); filter.connect(master);
      src.start(t); src.stop(t+.26);
    }catch(e){}
  }
  function playExplosionSound(){
    try{
      const ctx=ensureAudio(), t=ctx.currentTime;
      const out=ctx.createGain();
      out.gain.setValueAtTime(.0001,t);
      out.gain.exponentialRampToValueAtTime(.11,t+.008);
      out.gain.exponentialRampToValueAtTime(.0001,t+.65);
      out.connect(ctx.destination);

      const noise=ctx.createBufferSource();
      noise.buffer=makeNoiseBuffer(ctx,.72);
      const low=ctx.createBiquadFilter();
      low.type='lowpass';
      low.frequency.setValueAtTime(420,t);
      low.frequency.exponentialRampToValueAtTime(110,t+.55);
      noise.connect(low); low.connect(out);
      noise.start(t); noise.stop(t+.72);

      const boom=ctx.createOscillator(), boomGain=ctx.createGain();
      boom.type='sine';
      boom.frequency.setValueAtTime(82+Math.random()*20,t);
      boom.frequency.exponentialRampToValueAtTime(34,t+.38);
      boomGain.gain.setValueAtTime(.0001,t);
      boomGain.gain.exponentialRampToValueAtTime(.12,t+.015);
      boomGain.gain.exponentialRampToValueAtTime(.0001,t+.45);
      boom.connect(boomGain); boomGain.connect(out);
      boom.start(t); boom.stop(t+.46);
    }catch(e){}
  }

  function launchRocket(){
    const x=4+Math.random()*92;
    const y=5+Math.random()*45;
    const color=fireworkColors[Math.floor(Math.random()*fireworkColors.length)];
    const rocket=document.createElement('i');
    rocket.className='rocket';
    rocket.style.setProperty('--x',x+'%');
    rocket.style.setProperty('--c',color);
    rocket.style.setProperty('--dur',(520+Math.random()*380)+'ms');
    rocket.style.setProperty('--rise',(48+Math.random()*40)+'vh');
    rocket.style.setProperty('--drift',(-60+Math.random()*120)+'px');
    fireworks.appendChild(rocket);
    playLaunchSound();
    const duration=520+Math.random()*380;
    setTimeout(()=>{
      burstFirework(x,y,color);
      playExplosionSound();
      rocket.remove();
    },duration);
  }
  function startBirthday(){
    clearInterval(fireworkTimer); clearInterval(statusTimer); fireworks.innerHTML='';
    birthdayOverlay.classList.add('show'); birthdayOverlay.setAttribute('aria-hidden','false');
    fireworkEnd=Date.now()+10000;
    // 連續從螢幕底部高速往上發射，讓 10 秒煙火秀更有「狂射」的感覺。
    for(let i=0;i<14;i++) setTimeout(launchRocket,i*70);
    fireworkTimer=setInterval(launchRocket,95);
    statusTimer=setInterval(()=>{
      const left=Math.max(0,Math.ceil((fireworkEnd-Date.now())/1000));
      fireworkStatus.textContent=left>0?`煙火施放中 · ${left} 秒`:'煙火秀結束，生日快樂！ 🎂';
      if(left<=0){clearInterval(fireworkTimer);clearInterval(statusTimer);fireworkTimer=null;statusTimer=null;}
    },200);
  }
  function hideBirthday(){
    birthdayOverlay.classList.remove('show'); birthdayOverlay.setAttribute('aria-hidden','true');
    if(fireworkTimer) clearInterval(fireworkTimer);
    if(statusTimer) clearInterval(statusTimer);
    fireworkTimer=null;statusTimer=null;fireworks.innerHTML='';
  }
  celebrateBtn.addEventListener('click',startBirthday);
  closeBirthday.addEventListener('click',hideBirthday);
  birthdayOverlay.addEventListener('click',e=>{if(e.target===birthdayOverlay) hideBirthday();});
})();
</script>
